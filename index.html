<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#064e3b"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>Escala de Porteiros</title></head><body><header><div><h1>Escala de Porteiros</h1><p>Congregação Cristã no Brasil</p></div><button id="adm">Modo ADM</button></header><main><section class="box filters"><label>Ano<input id="ano" type="number"></label><label>Grupo<select id="grupo"><option value="">Todos</option><option>Grupo 1</option><option>Grupo 2</option><option>Grupo 3</option></select></label><label>Nome<input id="nome" placeholder="Buscar porteiro"></label><label>Data<input id="data" type="date"></label><button id="excel">Exportar Excel</button><button id="json">Exportar JSON</button><label class="button hide" id="impLabel">Importar JSON<input hidden id="imp" type="file" accept=".json"></label></section><section id="admin" class="box hide"><h2>Administração</h2><p>Preencha os quatro porteiros de cada grupo.</p><div id="editores"></div><button id="salvar">Salvar alterações</button><button id="sair">Sair do ADM</button></section><h2 id="titulo"></h2><p id="contagem"></p><section id="lista" class="grid"></section></main><div id="login" class="modal hide"><form><h2>Acesso administrativo</h2><input id="senha" type="password" inputmode="numeric" placeholder="Senha"><p id="erro"></p><button>Entrar</button><button type="button" id="cancelar">Cancelar</button></form></div><script src="app.js"></script></body></html>
